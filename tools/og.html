<!doctype html>
<!-- Social preview image (assets/img/og.png, 1200x630). Render: see tools/README in build.py docstring or run
     msedge --headless --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=assets/img/og.png tools/og.html -->
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';font-weight:700;src:url('../assets/fonts/archivo-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-weight:600;src:url('../assets/fonts/archivo-latin-600-normal.woff2') format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#17304f;font-family:'Archivo',sans-serif;color:#f3f2f2}
.wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:600px 600px}
.left{padding:64px 0 0 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px}
.bw{display:flex;flex-direction:column;font-weight:700;font-size:34px;line-height:.9;letter-spacing:-.03em}
.bw b{color:#ff7a2e}
.mark{width:130px;height:54px}
h1{margin:44px 0 0;font-weight:700;font-size:62px;line-height:.98;letter-spacing:-.035em}
h1 span{color:#ff7a2e;display:block}
.facts{margin-top:auto;display:flex;border-top:1px solid rgba(243,242,242,.3);margin-right:24px}
.facts div{padding:16px 22px 40px 0;font-size:16px;color:#b8c1ce;white-space:nowrap}
.facts div + div{padding-left:22px;border-left:1px solid rgba(243,242,242,.3)}
.facts b{display:block;color:#f3f2f2;font-size:24px}
.right{background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.right img{width:600px;height:600px;margin-top:20px}
.band{position:absolute;right:0;top:0;width:600px;height:14px;background:#f0650f}
</style></head><body><div class="wrap">
<div class="left">
  <div class="brand"><img class="mark" src="../assets/img/logo-mark-light.svg" alt=""><span class="bw">Stabil<b>Umzug</b></span></div>
  <h1>Umzug in Essen und ganz Deutschland.<span>Stabil geplant.</span></h1>
  <div class="facts"><div><b>10 Min.</b>online planen</div><div><b>24 Std.</b>bis zum Angebot</div><div><b>0163 9688190</b>Tel / WhatsApp</div></div>
</div>
<div class="right"><img src="../assets/img/van-branded.png" alt=""></div>
<div class="band"></div>
</div></body></html>
